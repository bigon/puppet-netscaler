---
inherit_gem:
  voxpupuli-test: rubocop.yml

AllCops:
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'
    - 'pkg/**/*'
    # Generated by tools/generate.rb
    - 'lib/puppet/type/nitro_*.rb'
    - 'lib/puppet/provider/nitro_*/*.rb'
    - 'lib/puppet_x/netscaler/specs.rb'
    # Generated by tools/generate_compat.rb
    - 'lib/puppet/type/netscaler_*.rb'
    # Data derived from puppetlabs-netscaler
    - 'lib/puppet_x/netscaler/compat_definitions.rb'

# expect(...).to receive is clearer than spies for HTTP/client call sequences
RSpec/MessageSpies:
  Enabled: false
RSpec/StubbedMock:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Max: 8
