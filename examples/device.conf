# /etc/puppetlabs/puppet/device.conf on the proxy agent
[ns01.example.com]
type netscaler
url file:///etc/puppetlabs/puppet/devices/ns01.example.com.conf

# Legacy puppetlabs-netscaler syntax is still accepted:
